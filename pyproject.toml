[project]
name = "serpsense"
version = "0.1.0"
description = "Reputation intelligence from what Google shows. Built with SerpApi."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16",
    "anthropic>=0.77",
    "celery[redis]>=5.4",
    "cryptography>=43",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "redis>=5.2",
    "serpapi>=0.1.5",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
serpsense = "serpsense.entrypoints.cli:app"

[dependency-groups]
dev = [
    "celery-types>=0.22",
    "coverage[toml]>=7.6",
    "diff-cover>=9.2",
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "polyfactory>=2.18",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff>=0.8",
    "testcontainers[postgres,redis]>=4.8",
    "time-machine>=2.16",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serpsense"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "C90", "PL", "RUF", "SIM", "DTZ", "PTH", "TID", "BLE", "T20", "ERA",
]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests assert with `assert` and use obviously fake, non-secret fixture values.
"tests/**" = ["S101", "S105", "S106", "PLR0913"]
"migrations/**" = ["ERA001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["serpsense"]

# The SerpApi SDK ships no type information; only adapters/serp imports it (import-linter).
[[tool.mypy.overrides]]
module = ["serpapi", "serpapi.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket -p no:randomly"
markers = [
    "unit: pure logic, no I/O",
    "contract: parsing recorded provider fixtures",
    "integration: talks to Postgres/Redis via testcontainers (sockets enabled)",
    "api: HTTP contracts through FastAPI TestClient",
    "security: authn/authz, scoping and abuse cases",
]
filterwarnings = [
    "error",
    # Third-party: testcontainers' own modules still use its deprecated wait decorator.
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/serpsense"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- import-linter (AGENTS.md §2)
[tool.importlinter]
root_package = "serpsense"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "serpsense.entrypoints",
    "serpsense.composition",
    "serpsense.adapters",
    "serpsense.services",
    "serpsense.ports",
    "serpsense.domain",
]

[[tool.importlinter.contracts]]
name = "Entrypoints reach adapters only through composition"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["serpsense.entrypoints"]
forbidden_modules = ["serpsense.adapters"]

[[tool.importlinter.contracts]]
name = "Adapters never import services"
type = "forbidden"
source_modules = ["serpsense.adapters"]
forbidden_modules = ["serpsense.services"]

[[tool.importlinter.contracts]]
name = "Ports and services stay free of I/O libraries"
type = "forbidden"
source_modules = ["serpsense.ports", "serpsense.services"]
forbidden_modules = [
    "anthropic", "celery", "cryptography", "fastapi", "kombu", "psycopg", "redis", "serpapi",
    "smtplib", "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O, config, logging or frameworks"
type = "forbidden"
source_modules = ["serpsense.domain"]
forbidden_modules = [
    "serpsense.config", "serpsense.observability", "anthropic", "celery", "cryptography",
    "fastapi", "kombu", "psycopg", "pydantic_settings", "redis", "serpapi", "smtplib", "socket",
    "sqlalchemy", "structlog", "tenacity",
]

# SDK isolation (AGENTS.md §2): one contract per SDK over the whole package, with the single
# allowed home whitelisted, so new packages are covered automatically. Unmatched whitelist
# entries are allowed because some adapters don't exist yet. The composition root may import
# celery only to type the app it wires.
[[tool.importlinter.contracts]]
name = "Anthropic SDK only in adapters.llm"
type = "forbidden"
source_modules = ["serpsense"]
forbidden_modules = ["anthropic"]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "serpsense.adapters.llm -> anthropic",
    "serpsense.adapters.llm.** -> anthropic",
]

[[tool.importlinter.contracts]]
name = "SerpApi SDK only in adapters.serp"
type = "forbidden"
source_modules = ["serpsense"]
forbidden_modules = ["serpapi"]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "serpsense.adapters.serp -> serpapi",
    "serpsense.adapters.serp.** -> serpapi",
]

[[tool.importlinter.contracts]]
name = "Celery/kombu only in adapters.jobs and entrypoints.jobs"
type = "forbidden"
source_modules = ["serpsense"]
forbidden_modules = ["celery", "kombu"]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "serpsense.composition -> celery",
    "serpsense.adapters.jobs -> celery",
    "serpsense.adapters.jobs.** -> celery",
    "serpsense.adapters.jobs -> kombu",
    "serpsense.adapters.jobs.** -> kombu",
    "serpsense.entrypoints.jobs -> celery",
    "serpsense.entrypoints.jobs.** -> celery",
]

[[tool.importlinter.contracts]]
name = "Redis client only in adapters.cache"
type = "forbidden"
source_modules = ["serpsense"]
forbidden_modules = ["redis"]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "serpsense.adapters.cache -> redis",
    "serpsense.adapters.cache.** -> redis",
]

[[tool.importlinter.contracts]]
name = "cryptography only in adapters.crypto"
type = "forbidden"
source_modules = ["serpsense"]
forbidden_modules = ["cryptography"]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "serpsense.adapters.crypto -> cryptography",
    "serpsense.adapters.crypto.** -> cryptography",
]

[[tool.importlinter.contracts]]
name = "smtplib only in adapters.mail"
type = "forbidden"
source_modules = ["serpsense"]
forbidden_modules = ["smtplib"]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "serpsense.adapters.mail -> smtplib",
    "serpsense.adapters.mail.** -> smtplib",
]
