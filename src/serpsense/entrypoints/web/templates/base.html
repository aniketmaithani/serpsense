<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SerpSense{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="bar">
    <a class="brand" href="/">SerpSense</a>
    {% block nav %}{% endblock %}
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
  <footer class="site-foot">Created by Aniket Maithani. Built with SerpApi for the SerpApi India Hackathon 2026. Not affiliated with SerpApi, LLC.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
