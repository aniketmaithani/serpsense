{% extends "signin.html" %}
{% block title %}Sign in · SerpSense{% endblock %}
{% block card %}
  <p class="step">Step 1 of 2</p>
  <h1>Sign in</h1>
  <p class="muted">We'll email you a 6-digit code. No password needed.</p>
  {% if notice %}<p class="notice" role="status">{{ notice }}</p>{% endif %}
  {% if error %}<p class="error" id="problem" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="form_token" value="{{ form_token }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus value="{{ email or '' }}"{% if error %} aria-invalid="true" aria-describedby="problem"{% endif %}>
    <button type="submit">Email me a code</button>
  </form>
{% endblock %}
